<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NZ Noodles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #3d2350;
    --plum-soft: #4a2e49;
    --lemon: #fff0a8;
    --lemon-soft: #f0dd8f;
    --cream: #fbf6ec;
    --blue-bg: #b9ede9;
    --blue-text: #1f5c58;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--plum);
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
  }

  .hero__photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
    animation: settle 1.8s ease-out;
  }

  @keyframes settle {
    from { transform: scale(1.06); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .hero__scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(244, 166, 199, 0) 0%,
      rgba(244, 166, 199, 0.35) 62%,
      rgba(242, 145, 95, 0.72) 85%,
      rgba(255, 223, 166, 0.92) 100%
    );
  }

  .hero__content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 24px 8vh;
    width: 100%;
    max-width: 640px;
    animation: rise 1.4s ease-out 0.3s both;
  }

  @keyframes rise {
    from { transform: translateY(18px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .title {
    font-family: 'Fraunces', serif;
    font-style: normal;
    font-weight: 700;
    font-size: clamp(2.5rem, 8vw, 4.75rem);
    letter-spacing: -0.01em;
    line-height: 0.95;
    margin: 0 0 4px;
    color: var(--lemon);
  }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 25px;
  }

  .meta__line {
    font-family: 'Fraunces', serif;
    font-style: normal;
    font-weight: 500;
    font-size: 1.2rem;
    color: #ffd1a8;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .meta__line:nth-child(1) {
    font-weight: 600;
    text-transform: none;
    font-style: italic;
    letter-spacing: 0.01em;
  }

  .enter {
    display: inline-block;
    padding: 14px 40px;
    border: none;
    border-radius: 10px;
    color: var(--blue-text);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    background: var(--blue-bg);
    box-shadow: 0 2px 10px rgba(31, 92, 88, 0.18);
    transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  .enter:hover {
    background: #a3e2dd;
    box-shadow: 0 4px 14px rgba(31, 92, 88, 0.26);
    transform: translateY(-1px);
  }

  .enter:active {
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__photo, .hero__content { animation: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <img
    class="hero__photo"
    src="https://courtneytravels.github.io/nznoodles/MountCook.png"
    alt="Mount Cook / Aoraki"
  >
  <div class="hero__scrim"></div>

  <div class="hero__content">
    <h1 class="title">NZ Noodles</h1>
    <div class="meta">
      <span class="meta__line">South Island Road Trip</span>
      <span class="meta__line">Aotearoa New Zealand</span>
    </div>
    <a class="enter" href="https://courtneytravels.github.io/nznoodles/pick-your-vehicle.html">Enter</a>
  </div>
</div>

</body>
</html>
